logging:
  version: 1
  disable_existing_loggers: false
  
  formatters:
    standard:
      format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
      datefmt: "%Y-%m-%d %H:%M:%S"
    json:
      format: '{"timestamp": "%(asctime)s", "name": "%(name)s", "level": "%(levelname)s", "message": "%(message)s"}'
      
  handlers:
    console:
      class: "logging.StreamHandler"
      level: "INFO"
      formatter: "standard"
      stream: "ext://sys.stdout"
      
    file_pipeline:
      class: "logging.handlers.RotatingFileHandler"
      level: "DEBUG"
      formatter: "json"
      filename: "storage/logs/pipeline/pipeline.log"
      maxBytes: 10485760 # 10MB
      backupCount: 5

    file_collector:
      class: "logging.handlers.RotatingFileHandler"
      level: "DEBUG"
      formatter: "json"
      filename: "storage/logs/collector/collector.log"
      maxBytes: 10485760 # 10MB
      backupCount: 5
      
  loggers:
    pipeline:
      level: "DEBUG"
      handlers: ["console", "file_pipeline"]
      propagate: false
      
    collector:
      level: "DEBUG"
      handlers: ["console", "file_collector"]
      propagate: false
      
  root:
    level: "INFO"
    handlers: ["console"]
